if(a==='read-water'){state.unread=Math.max(0,state.unread-1);render();sheet('Отключение воды','Сегодня, 10:00–14:00. Демонстрационное сообщение организации для выбранного адреса. Обновлено в 08:00.');return;}
if(a==='retry'){state.demo='normal';render();return;}
if(a==='supported'){sheet('Вы присоединились',state.joined?'Яма у перехода · обновления включены.':'Вы пока не присоединились к проблемам.',state.joined?'<button class="btn" data-go="detail">Открыть карточку</button>':'');return;}
if(a==='owned'){toast('Показаны ваши обращения.');return;}
if(a==='select-city'){toast('Выбрана Астана для демонстрации.');return;}
if(a==='close'){$('modal').hidden=true;return;}
if(a==='house-request'){go('new');state.category='water';document.querySelectorAll('[data-category]').forEach(e=>e.classList.toggle('active',e.dataset.category==='water'));toast('Заявка по дому. Публичность согласуется отдельно.');return;}
if(a==='house-contact'){sheet('Контакты ОСИ','ОСИ «Наш дом». В рабочем приложении здесь будут проверенные телефон, часы работы и ответственное лицо.');return;}
if(a==='notification-settings'){sheet('Уведомления','Обновления по обращениям и выбранным адресам.','<label class="toggleline">Получать уведомления<input type="checkbox" checked aria-label="Получать уведомления"></label>');return;}
if(a==='privacy'){sheet('Конфиденциальность','Телефон, адрес дома из профиля и токены устройства доступны только в закрытом контуре. На карте публикуются описание и место самой проблемы.');return;}
if(a==='help'){sheet('Помощь','Выберите проблему на карте, присоединитесь к ней или создайте обращение. Статус организации появляется после подтверждения.');return;}
if(a==='add-address'){sheet('Новый адрес','Назовите место и укажите адрес.','<label class="label" for="new-address">Адрес</label><input class="field" id="new-address" placeholder="Город, улица, дом"><button class="btn" data-act="save-address">Сохранить</button>');return;}
if(a==='save-address'){if(!$('new-address').value.trim()){toast('Укажите адрес.');return;}$('modal').hidden=true;toast('Адрес добавлен в демонстрационное состояние.');return;}
if(a==='delete'){sheet('Удаление аккаунта','В рабочем приложении здесь показываются последствия удаления и требуется повторное подтверждение пользователя. В прототипе удаление не выполняется.');return;}
if(a==='otp'){if($('phone-input').value.replace(/\D/g,'').length!==11||!$('authagree').checked){$('autherror').textContent='Введите номер +7 и подтвердите согласие.';return;}sheet('Введите код','Демонстрация входа. SMS не отправляется.','<label class="label" for="otp">Код из 6 цифр</label><input class="field" id="otp" maxlength="6" inputmode="numeric" autocomplete="one-time-code"><button class="btn" data-act="demo-login">Войти в демо</button>');return;}
if(a==='demo-login'){if(!/^\d{6}$/.test($('otp').value)){toast('Введите 6 цифр для демонстрации.');return;}go('nearby');toast('Демонстрационный вход выполнен.');return;}
if(a==='reopen'){sheet('Проблема осталась','Приложите актуальное фото и пояснение. Модератор проверит повторное открытие.','<label class="label" for="reopen-text">Пояснение</label><textarea class="field" id="reopen-text"></textarea><button class="btn" data-act="send-reopen">Отправить на проверку</button>');return;}
if(a==='send-reopen'){if(!$('reopen-text').value.trim()){toast('Добавьте пояснение.');return;}$('modal').hidden=true;toast('Повторное открытие отправлено на проверку в демо.');return;}
if(a==='admin-select'){document.querySelectorAll('.drow').forEach(e=>e.classList.toggle('selected',e===b));const type=b.dataset.type;$('admin-detail-title').textContent={road:'Яма у перехода',light:'Не работает фонарь',waste:'Мусор у контейнера'}[type];$('admin-category').textContent={road:'Дороги',light:'Освещение',waste:'Мусор'}[type];$('admin-number').textContent={road:'QG-00128',light:'QG-00127',waste:'QG-00126'}[type];$('admin-description').textContent={road:'Повреждён асфальт рядом с переходом. Просим проверить участок.',light:'Не горит уличный фонарь. Просим проверить освещение.',waste:'Мусор скопился рядом с контейнером. Просим организовать уборку.'}[type];return;}
if(a==='moderate'){if(!$('media-check').checked){$('admin-feedback').textContent='Сначала подтвердите проверку содержания и изображения.';return;}$('admin-feedback').textContent='В демо: опубликовано и передано выбранной организации. Принятие организацией ещё не подтверждено.';return;}
if(a==='correction'){$('admin-feedback').textContent='В демо: возвращено на уточнение. Автор получит причину.';return;}
if(a==='result-photo'){state.resultPhoto=true;$('result-photo').textContent='Фото результата добавлено';return;}
if(a==='start-work'){$('admin-feedback').textContent='В демо: организация подтвердила принятие и начало работы.';return;}
if(a==='resolve'){if(!$('result-comment').value.trim()||!state.resultPhoto){$('admin-feedback').textContent='Добавьте комментарий и фото результата перед завершением.';return;}state.resolved=true;$('admin-feedback').textContent='В демо: решение сохранено с фото результата. Житель может запросить повторное открытие.';return;}
if(a==='admin-extra'){$('admin-feedback').textContent='Раздел описан в ТЗ. Здесь подробно показана обработка обращений.';return;}
}
document.addEventListener('click',function(e){const b=e.target.closest('[data-go],[data-act],[data-filter],[data-category]');if(!b)return;if(b.dataset.go)go(b.dataset.go,b.dataset.type);else if(b.dataset.act)act(b.dataset.act,b);else if(b.dataset.category){state.category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x===b));}else if(b.dataset.filter){document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));$('issues').querySelectorAll('[data-type]').forEach(x=>x.hidden=b.dataset.filter!=='all'&&x.dataset.type!==b.dataset.filter);}});
document.addEventListener('change',function(e){if(e.target.id==='demo-state'){state.demo=e.target.value;state.screen='nearby';render();}if(e.target.id==='role')setRole();});
render();
